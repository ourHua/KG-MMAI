name: release-integrity

on:
  push:
    branches: [main]
    paths-ignore:
      - 'KG-MMAI_LIJUNHUA/MANIFEST_SHA256.csv'
      - 'KG-MMAI_LIJUNHUA/figures/fig06_annotation_sensitivity.png'
      - 'KG-MMAI_LIJUNHUA/figures/fig06_annotation_sensitivity.pdf'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KG-MMAI_LIJUNHUA

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: KG-MMAI_LIJUNHUA/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest cffconvert

      - name: Regenerate Figure 6
        run: python code/figures/fig06_annotation_sensitivity.py

      - name: Refresh release manifest
        run: python tools/update_manifest.py

      - name: Verify manifest
        run: python tools/verify_manifest.py

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run manuscript audit
        run: python code/12_revision_audit.py

      - name: Validate citation metadata
        run: cffconvert --validate -i CITATION.cff

      - name: Commit refreshed release files
        if: success()
        run: |
          if git diff --quiet -- figures/fig06_annotation_sensitivity.png figures/fig06_annotation_sensitivity.pdf MANIFEST_SHA256.csv; then
            echo 'Release files already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add figures/fig06_annotation_sensitivity.png figures/fig06_annotation_sensitivity.pdf MANIFEST_SHA256.csv
            git commit -m 'Regenerate Figure 6 and refresh release manifest'
            git push
          fi

      - name: Mark release checks passed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=release-integrity \
            -f description='manifest, tests, audit and CFF passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark release checks failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=release-integrity \
            -f description='one or more release checks failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
