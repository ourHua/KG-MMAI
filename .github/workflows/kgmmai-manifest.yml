name: KG-MMAI manifest

on:
  push:
    branches:
      - manuscript-aligned-release
    paths:
      - 'KG-MMAI_LIJUNHUA/**'
      - '.github/workflows/kgmmai-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manuscript-aligned-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate public SHA-256 manifest
        working-directory: KG-MMAI_LIJUNHUA
        run: |
          python tools/update_manifest.py
          python tools/verify_manifest.py
      - name: Commit manifest when changed
        run: |
          if git diff --quiet -- KG-MMAI_LIJUNHUA/MANIFEST_SHA256.csv; then
            echo 'Manifest already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KG-MMAI_LIJUNHUA/MANIFEST_SHA256.csv
          git commit -m 'Refresh SHA-256 release manifest'
          git push origin HEAD:manuscript-aligned-release
